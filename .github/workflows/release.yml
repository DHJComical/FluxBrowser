name: Release FluxBrowser

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.release_version.outputs.version }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Sync Package Version To Git Tag
        id: release_version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.Substring(1)
          "version=$version" >> $env:GITHUB_OUTPUT
          node -e "const fs=require('fs'); const path='package.json'; const pkg=JSON.parse(fs.readFileSync(path,'utf8')); pkg.version=process.argv[1]; fs.writeFileSync(path, JSON.stringify(pkg, null, '\t') + '\n');" $version

      - name: Build and Publish Electron App
        run: npm run build -- --publish always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_release_notes:
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Publish GitHub Release Notes
        uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
          tag: ${{ github.ref_name }}
          version: ${{ needs.publish.outputs.version }}
          commitish: ${{ github.sha }}
          publish: true
          latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
