name: Release FluxBrowser

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Draft Release Metadata
        id: release_drafter
        uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stop When No New Release Is Needed
        if: steps.release_drafter.outputs.resolved_version == ''
        shell: pwsh
        run: |
          Write-Host "No releasable changes detected."

      - name: Setup Node.js
        if: steps.release_drafter.outputs.resolved_version != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        if: steps.release_drafter.outputs.resolved_version != ''
        run: npm install

      - name: Sync Package Version To Release Tag
        if: steps.release_drafter.outputs.resolved_version != ''
        shell: pwsh
        run: |
          $version = "${{ steps.release_drafter.outputs.resolved_version }}"
          node -e "const fs=require('fs'); const path='package.json'; const pkg=JSON.parse(fs.readFileSync(path,'utf8')); pkg.version=process.argv[1]; fs.writeFileSync(path, JSON.stringify(pkg, null, '\t') + '\n');" $version

      - name: Build and Publish Electron App
        if: steps.release_drafter.outputs.resolved_version != ''
        run: npm run build -- --publish always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release
        if: steps.release_drafter.outputs.resolved_version != ''
        uses: release-drafter/release-drafter@v7
        with:
          version: ${{ steps.release_drafter.outputs.resolved_version }}
          publish: true
          latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
