name: Release FluxBrowser

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Version Change
        id: version_change
        shell: pwsh
        run: |
          $before = "${{ github.event.before }}"
          if (-not $before -or $before -eq "0000000000000000000000000000000000000000") {
            "changed=true" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $changedFiles = git diff --name-only $before ${{ github.sha }}
          if ($changedFiles -notcontains "package.json") {
            "changed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $beforeVersion = git show "$before`:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version"
          $currentVersion = node -p "require('./package.json').version"

          if ($beforeVersion -ne $currentVersion) {
            "changed=true" >> $env:GITHUB_OUTPUT
          } else {
            "changed=false" >> $env:GITHUB_OUTPUT
          }

      - name: Setup Node.js
        if: steps.version_change.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        if: steps.version_change.outputs.changed == 'true'
        run: npm install

      - name: Read App Version
        if: steps.version_change.outputs.changed == 'true'
        id: app_version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build and Publish Electron App
        if: steps.version_change.outputs.changed == 'true'
        run: npm run build -- --publish always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release
        if: steps.version_change.outputs.changed == 'true'
        uses: release-drafter/release-drafter@v7
        with:
          version: ${{ steps.app_version.outputs.version }}
          publish: true
          latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
