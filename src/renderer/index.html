<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
  <div
    id="flux-bar"
    data-floating-panel
    data-panel-id="mainbar"
  >
    <div class="mainbar-row">
      <div class="brand-panel">
        <div class="drag-region" data-floating-handle>FluxBrowser</div>
        <div class="window-status" id="window-status">准备就绪</div>
      </div>

      <div class="menu-container">
        <button id="menu-btn"><i class="material-icons">menu</i></button>
        <div id="dropdown-menu" class="hidden">
          <div class="menu-item" id="settings-btn">
            <i class="material-icons">settings</i> 设置
          </div>
          <div class="menu-divider"></div>

          <div class="menu-submenu" id="resolution-menu">
            <div class="menu-item">
              <i class="material-icons">aspect_ratio</i> 分辨率预设
              <i class="material-icons submenu-arrow">chevron_right</i>
            </div>
            <div class="submenu-content" id="resolution-submenu"></div>
          </div>
          <div class="menu-divider"></div>

          <div class="menu-item" id="add-bookmark-btn">
            <i class="material-icons">bookmark_add</i> 添加书签
          </div>
          <div class="menu-item" id="view-bookmarks-btn">
            <i class="material-icons">bookmarks</i> 查看书签
          </div>
          <div class="menu-divider"></div>

          <div class="menu-item" id="exit-btn">
            <i class="material-icons">power_settings_new</i> 退出
          </div>
        </div>
      </div>

      <div class="input-group">
        <div class="address-meta">
          <span class="address-label">地址</span>
          <span class="page-title" id="page-title">未加载页面</span>
        </div>
        <input type="text" id="url-input" placeholder="输入网址后回车或点击前往" value="">
        <button id="go-btn"><i class="material-icons">arrow_forward</i></button>
      </div>
    </div>

    <div class="mainbar-tabs">
      <div class="tabbar-strip" id="tabbar-strip"></div>
      <button id="tabbar-add-btn" class="tabbar-add-btn" title="新建标签页">
        <i class="material-icons">add</i>
      </button>
    </div>
  </div>

  <section
    class="floating-panel webview-panel"
    id="webview-panel"
    data-floating-panel
    data-panel-id="webview"
    data-size-target="content"
  >
    <div class="floating-panel-grip" data-floating-handle title="拖动网页悬浮窗">
      <span></span>
    </div>
    <div class="floating-panel-resize resize-east" data-resize-handle="east"></div>
    <div class="floating-panel-resize resize-south" data-resize-handle="south"></div>
    <div class="floating-panel-resize resize-corner" data-resize-handle="southeast"></div>
    <div class="floating-panel-content">
      <div id="webview-stack"></div>
    </div>
  </section>

  <script src="js/client.js"></script>
  <script src="js/tabbar.js"></script>
</body>
</html>
