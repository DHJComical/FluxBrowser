<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
  <div
    id="flux-bar"
    data-floating-panel
    data-panel-id="mainbar"
  >
    <div class="mainbar-row">
      <div class="brand-panel">
        <div class="drag-region" data-floating-handle>FluxBrowser</div>
      </div>

      <div class="menu-container">
        <button id="menu-btn"><i class="material-icons">menu</i></button>
        <div id="dropdown-menu" class="hidden">
          <div class="menu-item" id="settings-btn" data-i18n="main.menu.settings">
            <i class="material-icons">settings</i> &#35774;&#32622;
          </div>
          <div class="menu-divider"></div>

          <div class="menu-submenu" id="resolution-menu">
            <div class="menu-item" data-i18n="main.menu.resolutionPresets">
              <i class="material-icons">aspect_ratio</i> &#20998;&#36776;&#29575;&#39044;&#35774;
              <i class="material-icons submenu-arrow">chevron_right</i>
            </div>
            <div class="submenu-content" id="resolution-submenu"></div>
          </div>
          <div class="menu-divider"></div>

          <div class="menu-item" id="add-bookmark-btn" data-i18n="main.menu.addBookmark">
            <i class="material-icons">bookmark_add</i> &#28155;&#21152;&#20070;&#31614;
          </div>
          <div class="menu-item" id="view-bookmarks-btn" data-i18n="main.menu.viewBookmarks">
            <i class="material-icons">bookmarks</i> &#26597;&#30475;&#20070;&#31614;
          </div>
          <div class="menu-divider"></div>

          <div class="menu-item" id="exit-btn" data-i18n="main.menu.exit">
            <i class="material-icons">power_settings_new</i> &#36864;&#20986;
          </div>
        </div>
      </div>

      <div class="input-group">
        <div class="nav-controls" aria-label="Navigation controls">
          <button
            id="back-btn"
            class="nav-control-btn"
            data-i18n-title="main.navigation.backAction"
            data-i18n-aria-label="main.navigation.backAction"
            title="&#21518;&#36864;"
            aria-label="&#21518;&#36864;"
          >
            <i class="material-icons">arrow_back_ios_new</i>
          </button>
          <button
            id="forward-btn"
            class="nav-control-btn"
            data-i18n-title="main.navigation.forwardAction"
            data-i18n-aria-label="main.navigation.forwardAction"
            title="&#21069;&#36827;"
            aria-label="&#21069;&#36827;"
          >
            <i class="material-icons">arrow_forward_ios</i>
          </button>
          <button
            id="refresh-btn"
            class="nav-control-btn"
            data-i18n-title="main.navigation.refreshAction"
            data-i18n-aria-label="main.navigation.refreshAction"
            title="&#21047;&#26032;"
            aria-label="&#21047;&#26032;"
          >
            <i class="material-icons">refresh</i>
          </button>
        </div>

        <div class="address-input-shell">
          <input
            type="text"
            id="url-input"
            data-i18n-placeholder="main.navigation.inputPlaceholder"
            placeholder="&#36755;&#20837;&#32593;&#22336;&#21518;&#22238;&#36710;&#25110;&#28857;&#20987;&#21069;&#24448;"
            value=""
          >
        </div>
        <button
          id="go-btn"
          class="address-action-btn"
          data-i18n-title="main.navigation.goAction"
          data-i18n-aria-label="main.navigation.goAction"
          title="&#21069;&#24448;"
          aria-label="&#21069;&#24448;"
        >
          <i class="material-icons">arrow_forward</i>
        </button>
      </div>
    </div>

    <div class="mainbar-tabs">
      <div class="tabbar-strip" id="tabbar-strip"></div>
      <button
        id="tabbar-add-btn"
        class="tabbar-add-btn"
        data-i18n-title="main.tabs.newTab"
        title="&#26032;&#24314;&#26631;&#31614;&#39029;"
      >
        <i class="material-icons">add</i>
      </button>
    </div>
  </div>

  <section
    class="floating-panel webview-panel"
    id="webview-panel"
    data-floating-panel
    data-panel-id="webview"
    data-size-target="content"
  >
    <div
      class="floating-panel-grip"
      data-floating-handle
      data-i18n-title="main.webview.dragTitle"
      title="&#25302;&#21160;&#32593;&#39029;&#24748;&#28014;&#31383;"
    >
      <span></span>
    </div>
    <div class="floating-panel-resize resize-east" data-resize-handle="east"></div>
    <div class="floating-panel-resize resize-south" data-resize-handle="south"></div>
    <div class="floating-panel-resize resize-corner" data-resize-handle="southeast"></div>
    <div class="floating-panel-content">
      <div id="webview-stack"></div>
    </div>
  </section>

  <section
    class="floating-panel direction-indicator-panel"
    id="direction-indicator-panel"
    data-floating-panel
    data-panel-id="direction-indicator"
    data-resize-mode="square"
    data-min-width="160"
    data-min-height="160"
  >
    <div class="direction-indicator-shell">
      <div class="direction-indicator-transform">
        <div class="direction-indicator-frame" aria-hidden="true"></div>
        <button
          class="direction-indicator-handle handle-northwest"
          data-resize-handle="northwest"
          data-i18n-aria-label="main.indicator.resizeNorthwest"
          aria-label="&#21521;&#24038;&#19978;&#32553;&#25918;"
        ></button>
        <button
          class="direction-indicator-handle handle-north"
          data-resize-handle="north"
          data-i18n-aria-label="main.indicator.resizeNorth"
          aria-label="&#21521;&#19978;&#32553;&#25918;"
        ></button>
        <button
          class="direction-indicator-handle handle-northeast"
          data-resize-handle="northeast"
          data-i18n-aria-label="main.indicator.resizeNortheast"
          aria-label="&#21521;&#21491;&#19978;&#32553;&#25918;"
        ></button>
        <button
          class="direction-indicator-handle handle-east"
          data-resize-handle="east"
          data-i18n-aria-label="main.indicator.resizeEast"
          aria-label="&#21521;&#21491;&#32553;&#25918;"
        ></button>
        <button
          class="direction-indicator-handle handle-southeast"
          data-resize-handle="southeast"
          data-i18n-aria-label="main.indicator.resizeSoutheast"
          aria-label="&#21521;&#21491;&#19979;&#32553;&#25918;"
        ></button>
        <button
          class="direction-indicator-handle handle-south"
          data-resize-handle="south"
          data-i18n-aria-label="main.indicator.resizeSouth"
          aria-label="&#21521;&#19979;&#32553;&#25918;"
        ></button>
        <button
          class="direction-indicator-handle handle-southwest"
          data-resize-handle="southwest"
          data-i18n-aria-label="main.indicator.resizeSouthwest"
          aria-label="&#21521;&#24038;&#19979;&#32553;&#25918;"
        ></button>
        <button
          class="direction-indicator-handle handle-west"
          data-resize-handle="west"
          data-i18n-aria-label="main.indicator.resizeWest"
          aria-label="&#21521;&#24038;&#32553;&#25918;"
        ></button>
        <button
          class="direction-indicator-move"
          data-floating-handle
          data-i18n-title="main.indicator.move"
          data-i18n-aria-label="main.indicator.move"
          title="&#31227;&#21160;&#25351;&#31034;&#22120;"
          aria-label="&#31227;&#21160;&#25351;&#31034;&#22120;"
        ></button>
        <div class="direction-indicator-rotate-stem" aria-hidden="true"></div>
        <button
          class="direction-indicator-rotate"
          id="direction-indicator-rotate-handle"
          data-i18n-title="main.indicator.rotate"
          data-i18n-aria-label="main.indicator.rotate"
          title="&#26059;&#36716;&#25351;&#31034;&#22120;"
          aria-label="&#26059;&#36716;&#25351;&#31034;&#22120;"
        ></button>
      </div>

      <div class="direction-indicator-dial" id="direction-indicator-dial">
        <div class="direction-indicator-ring"></div>
        <div class="direction-indicator-cross"></div>
        <span class="direction-label north">N</span>
        <span class="direction-label east">E</span>
        <span class="direction-label south">S</span>
        <span class="direction-label west">W</span>
        <div class="direction-indicator-markers" id="direction-indicator-markers"></div>
      </div>

      <div
        class="direction-indicator-hint"
        data-i18n="main.indicator.subtitleHint"
      >若要使用此功能，请打开视频字幕</div>
    </div>
  </section>

  <script src="js/client.js"></script>
  <script src="js/tabbar.js"></script>
</body>
</html>
